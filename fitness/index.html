    const items = ROUT[type].map(([id, b, e]) => {
      const n = 3 + (rnd() < 0.4 ? 1 : 0), w = weightAt(b, e, wk), base = HIGH_REP.includes(id) ? 12 : 8;
      return { id: uid(), exerciseId: id, sets: Array.from({ length: n }, (_, i) => ({ id: uid(), weight: w, reps: Math.max(4, base + Math.floor(rnd() * 3) - 1 - (i >= 2 ? 1 : 0)), done: true })) };
    });
    workouts.push({ id: uid(), name: type + ' Day', start, end, items, sample: true });
  }
  const templates = Object.entries(ROUT).map(([type, list]) => ({
    id: uid(), name: type + ' Day', day: { Push: 1, Pull: 3, Legs: 5 }[type], sample: true,
    items: list.map(([id, b, e]) => ({ id: uid(), exerciseId: id, sets: Array.from({ length: 3 }, () => ({ id: uid(), weight: weightAt(b, e, 7.5), reps: HIGH_REP.includes(id) ? 12 : 8 })) })),
  }));
  const r2 = mulberry(7), runs = [];
  for (let off = 56; off >= 1; off--) {
    const d = new Date(today); d.setDate(d.getDate() - off);
    const dow = d.getDay(); if (![2, 6].includes(dow) || r2() < 0.25) continue;
    const wk = (56 - off) / 56, km = dow === 6 ? 8 + wk * 3 + r2() * 1.5 : 4 + wk * 1.5 + r2(), pace = 372 - wk * 26 + (r2() - 0.5) * 14;
    runs.push({ id: uid(), start: d.getTime() + 7 * 3600e3 + Math.floor(r2() * 90) * 60e3, distance: Math.round(km * 100) * 10, durationSec: Math.round(km * pace), route: null, note: '', mode: 'manual', sample: true });
  }
  return { workouts, templates, runs };
}

const KEY = 'setlog.v1';
function loadDb() {

let actx;
function unlockAudio() { try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === 'suspended') actx.resume(); } catch (e) {} }
function beep() {
  try {
    unlockAudio();
    [0, 0.25, 0.5].forEach((t, i) => {
      const o = actx.createOscillator(), g = actx.createGain(), s = actx.currentTime + t;
      o.frequency.value = i === 2 ? 988 : 784; o.connect(g); g.connect(actx.destination);
      g.gain.setValueAtTime(0.0001, s); g.gain.exponentialRampToValueAtTime(0.25, s + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, s + 0.2);
      o.start(s); o.stop(s + 0.22);
    });
    if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
  } catch (e) {}
}

function useNow(ms) { const [n, setN] = useState(Date.now()); useEffect(() => { const t = setInterval(() => setN(Date.now()), ms); return () => clearInterval(t); }, [ms]); return n; }
function useSize() {
  const ref = useRef(null); const [w, setW] = useState(320);
  useEffect(() => { const el = ref.current; if (!el) return; setW(el.clientWidth || 320); const ro = new ResizeObserver(() => setW(el.clientWidth || 320)); ro.observe(el); return () => ro.disconnect(); }, []);
  return [ref, w];
}

/* ---------- charts ---------- */
const GRID = '#2a2f3b', TICK = '#687080', SURF = '#171a21';

function Tooltip({ x, y, w, children }) {
  const left = Math.min(Math.max(x, 70), w - 70);
  const below = y < 56;
  return (
    <div className="pointer-events-none absolute z-10 rounded-lg bg-[#232834] border border-line px-2.5 py-1.5 text-xs shadow-lg whitespace-nowrap"
      style={{ left, top: below ? y + 14 : y - 8, transform: below ? 'translateX(-50%)' : 'translate(-50%,-100%)' }}>{children}</div>
  );
}

function barPath(x, y, w, h, r) {
  if (h <= 0) return '';
  r = Math.min(r, w / 2, h);
  return `M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z`;
}

function BarChart({ data, height = 200, color = '#ff7a3d', goal, fmt = fmtNum, unit = '', yFmt = compact }) {
  const [ref, w] = useSize(); const [hi, setHi] = useState(null);
  if (!data.length) return <div className="text-mute text-sm py-8 text-center">No data in this range yet.</div>;
  const m = { l: 36, r: 6, t: 10, b: 24 }, iw = Math.max(10, w - m.l - m.r), ih = height - m.t - m.b;
  const maxV = Math.max(...data.map((d) => d.value), goal || 0, 1);
  const ticks = niceTicks(0, maxV, 4), top = ticks[ticks.length - 1];
  const y = (v) => m.t + ih - (v / top) * ih;
  const n = data.length, band = iw / n, bw = Math.max(3, Math.min(band - 4, 34));
  const step = Math.max(1, Math.ceil(n / Math.max(1, Math.floor(iw / 54))));
  const onMove = (e) => { const r = ref.current.getBoundingClientRect(); const i = Math.floor((e.clientX - r.left - m.l) / band); setHi(i >= 0 && i < n ? i : null); };
  const d = hi != null ? data[hi] : null;
  return (
    <div ref={ref} className="relative w-full select-none">
      <svg width={w} height={height} style={{ touchAction: 'pan-y', display: 'block' }} onPointerMove={onMove} onPointerDown={onMove} onPointerLeave={() => setHi(null)}>
        {ticks.map((t) => (
          <g key={t}>
            <line x1={m.l} x2={w - m.r} y1={y(t)} y2={y(t)} stroke={GRID} strokeWidth="1" />
            <text x={m.l - 6} y={y(t) + 3.5} textAnchor="end" fontSize="10.5" fill={TICK}>{yFmt(t)}</text>
          </g>
        ))}
        {data.map((p, i) => {
          const cx = m.l + band * (i + 0.5), h = ih - (y(p.value) - m.t);
          return (
            <g key={i}>
              <path d={barPath(cx - bw / 2, y(p.value), bw, h, 4)} fill={color} opacity={hi == null || hi === i ? 1 : 0.55} />
              {i % step === 0 && <text x={cx} y={height - 7} textAnchor="middle" fontSize="10.5" fill={TICK}>{p.label}</text>}
            </g>
          );
        })}
        {goal > 0 && (
          <g>
            <line x1={m.l} x2={w - m.r} y1={y(goal)} y2={y(goal)} stroke="#eceff4" strokeWidth="1.25" strokeDasharray="4 4" opacity=".7" />
            <text x={w - m.r - 2} y={y(goal) - 5} textAnchor="end" fontSize="10.5" fill="#eceff4">Goal {goal}</text>
          </g>
        )}
      </svg>
      {d && <Tooltip x={m.l + band * (hi + 0.5)} y={y(d.value)} w={w}><div className="text-mute">{d.tip || d.label}</div><div className="font-semibold num">{fmt(d.value)}{unit && ' ' + unit}</div></Tooltip>}
    </div>
  );
}

function LineChart({ data, height = 200, color = '#4cc2ff', fmt = fmtNum, unit = '', yFmt = compact, zeroBase = false }) {
  const [ref, w] = useSize(); const [hi, setHi] = useState(null); const gid = useRef('g' + uid()).current;
  if (!data.length) return <div className="text-mute text-sm py-8 text-center">No data in this range yet.</div>;
  const m = { l: 40, r: 10, t: 14, b: 24 }, iw = Math.max(10, w - m.l - m.r), ih = height - m.t - m.b, n = data.length;
  const vals = data.map((d) => d.value);
  let mn = zeroBase ? 0 : Math.min(...vals), mx = Math.max(...vals);
  if (!zeroBase) { const pad = (mx - mn) * 0.2 || mx * 0.1 || 1; mn = Math.max(0, mn - pad); mx += pad; }
  const ticks = niceTicks(mn, mx, 4), lo = ticks[0], top = ticks[ticks.length - 1];
  const x = (i) => m.l + 10 + (n === 1 ? (iw - 20) / 2 : ((iw - 20) * i) / (n - 1));
  const y = (v) => m.t + ih - ((v - lo) / (top - lo)) * ih;
  const line = data.map((d, i) => (i ? 'L' : 'M') + x(i) + ',' + y(d.value)).join('');
  const area = line + `L${x(n - 1)},${m.t + ih}L${x(0)},${m.t + ih}Z`;
  const step = Math.max(1, Math.ceil(n / Math.max(1, Math.floor(iw / 54))));
  const onMove = (e) => { const r = ref.current.getBoundingClientRect(); const px = e.clientX - r.left - m.l - 10; setHi(n === 1 ? 0 : Math.max(0, Math.min(n - 1, Math.round(px / ((iw - 20) / (n - 1)))))); };
  const d = hi != null ? data[hi] : null, last = data[n - 1];
  return (
    <div ref={ref} className="relative w-full select-none">
      <svg width={w} height={height} style={{ touchAction: 'pan-y', display: 'block' }} onPointerMove={onMove} onPointerDown={onMove} onPointerLeave={() => setHi(null)}>
        <defs><linearGradient id={gid} x1="0" y1="0" x2="0" y2="1"><stop offset="0" stopColor={color} stopOpacity=".28" /><stop offset="1" stopColor={color} stopOpacity="0" /></linearGradient></defs>
        {ticks.map((t) => (
          <g key={t}>
            <line x1={m.l} x2={w - m.r} y1={y(t)} y2={y(t)} stroke={GRID} strokeWidth="1" />

        {data.map((p, i) => (n <= 30 || i === n - 1) && <circle key={i} cx={x(i)} cy={y(p.value)} r={i === n - 1 ? 4.5 : 3} fill={color} stroke={SURF} strokeWidth="2" />)}
        {data.map((p, i) => i % step === 0 && <text key={'l' + i} x={x(i)} y={height - 7} textAnchor="middle" fontSize="10.5" fill={TICK}>{p.label}</text>)}
        {hi == null && <text x={x(n - 1)} y={y(last.value) - 10} textAnchor={n > 1 ? 'end' : 'middle'} fontSize="11.5" fontWeight="600" fill="#eceff4">{fmt(last.value)}</text>}
        {d && (<g><line x1={x(hi)} x2={x(hi)} y1={m.t} y2={m.t + ih} stroke="#687080" strokeWidth="1" /><circle cx={x(hi)} cy={y(d.value)} r="5.5" fill={color} stroke={SURF} strokeWidth="2.5" /></g>)}
      </svg>
      {d && <Tooltip x={x(hi)} y={y(d.value)} w={w}><div className="text-mute">{d.tip || d.label}</div><div className="font-semibold num">{fmt(d.value)}{unit && ' ' + unit}</div></Tooltip>}
    </div>
  );
}

function Heatmap({ workouts }) {
  const [ref, w] = useSize(); const [tip, setTip] = useState(null);
  const weeks = w > 640 ? 26 : 16, left = 24, top = 18, gap = 3;
  const cell = Math.max(8, Math.min(20, Math.floor((w - left) / weeks) - gap));
  const start = startOfWeek(Date.now()); start.setDate(start.getDate() - 7 * (weeks - 1));
  const byDay = {};
  workouts.forEach((x) => { const k = dayKey(x.start); const e = byDay[k] || (byDay[k] = { vol: 0, names: [] }); e.vol += workoutVolume(x); e.names.push(x.name); });
  const maxV = Math.max(1, ...Object.values(byDay).map((e) => e.vol));
  const level = (v) => (v <= 0 ? 0 : v < maxV * 0.34 ? 1 : v < maxV * 0.67 ? 2 : 3);
  const fills = ['#232834', 'rgba(255,122,61,.35)', 'rgba(255,122,61,.65)', '#ff7a3d'];
  const cells = [], months = []; let prevM = -1;
  for (let c = 0; c < weeks; c++) {
    const cd = new Date(start); cd.setDate(cd.getDate() + c * 7);
    if (cd.getMonth() !== prevM) { months.push({ c, label: cd.toLocaleDateString(undefined, { month: 'short' }) }); prevM = cd.getMonth(); }
    for (let r = 0; r < 7; r++) {
      const d = new Date(start); d.setDate(d.getDate() + c * 7 + r);
      if (d.getTime() > Date.now()) continue;
      cells.push({ c, r, d, e: byDay[dayKey(d)] });
    }
  }
  const H = top + 7 * (cell + gap);
  return (
    <div ref={ref} className="relative w-full select-none">
      <svg width={w} height={H} style={{ display: 'block' }} onPointerLeave={() => setTip(null)}>
        {months.map((mo) => <text key={mo.c} x={left + mo.c * (cell + gap)} y={10} fontSize="10.5" fill={TICK}>{mo.label}</text>)}
        {['Mon', 'Wed', 'Fri'].map((l, i) => <text key={l} x={0} y={top + i * 2 * (cell + gap) + cell * 0.75} fontSize="10" fill={TICK}>{l[0]}</text>)}
        {cells.map(({ c, r, d, e }) => (
          <rect key={c + '-' + r} x={left + c * (cell + gap)} y={top + r * (cell + gap)} width={cell} height={cell} rx="3" fill={fills[level(e ? e.vol : 0)]}
            onPointerEnter={() => setTip({ x: left + c * (cell + gap) + cell / 2, y: top + r * (cell + gap), d, e })} onPointerDown={() => setTip({ x: left + c * (cell + gap) + cell / 2, y: top + r * (cell + gap), d, e })} />
        ))}
      </svg>
      {tip && <Tooltip x={tip.x} y={tip.y} w={w}><div className="text-mute">{fmtDate(tip.d)}</div><div className="font-semibold num">{tip.e ? tip.e.names.join(', ') + ' · ' + fmtNum(tip.e.vol) : 'Rest day'}</div></Tooltip>}
      <div className="flex items-center gap-1.5 mt-2 text-[11px] text-faint justify-end">Less{fills.map((f, i) => <span key={i} className="h-3 w-3 rounded-[3px]" style={{ background: f }} />)}More</div>
    </div>
  );
}

    const reps = blank(s.reps) ? (p ? p.reps : pr ? pr.reps : '') : s.reps;

/* ---------- rest timer ---------- */
function RestBar({ rest, setDb }) {
  const now = useNow(250); const fired = useRef(null);
  const left = Math.ceil((rest.end - now) / 1000), done = left <= 0;
  useEffect(() => {
    if (done && fired.current !== rest.end) { fired.current = rest.end; beep(); }
    if (done && now > rest.end + 6000) setDb((d) => ({ ...d, rest: null }));
  });
  const adjust = (s) => setDb((d) => ({ ...d, rest: d.rest && { ...d.rest, end: d.rest.end + s * 1000, total: Math.max(5000, d.rest.total + s * 1000) } }));
  const R = 18, C = 2 * Math.PI * R, frac = done ? 0 : Math.max(0, Math.min(1, (rest.end - now) / rest.total));
  return (
    <div className="fixed z-40 inset-x-3 md:left-[15rem] md:right-4 bottom-[calc(4.5rem+env(safe-area-inset-bottom,0px))] md:bottom-4 pop">
      <div className={'mx-auto max-w-xl rounded-2xl border px-3 py-2.5 flex items-center gap-3 shadow-xl ' + (done ? 'bg-ok border-ok text-[#06220f]' : 'bg-[#232834] border-line')}>
        <svg width="44" height="44" viewBox="0 0 44 44" className="shrink-0 -rotate-90">
          <circle cx="22" cy="22" r={R} fill="none" stroke={done ? 'rgba(6,34,15,.25)' : '#2f3542'} strokeWidth="4" />
          <circle cx="22" cy="22" r={R} fill="none" stroke={done ? '#06220f' : '#ff7a3d'} strokeWidth="4" strokeLinecap="round" strokeDasharray={C} strokeDashoffset={C * (1 - frac)} />
        </svg>
        <div className="flex-1 min-w-0">
          <div className={'text-[11px] uppercase tracking-wider ' + (done ? '' : 'text-mute')}>{done ? 'Rest complete' : 'Rest'}</div>
          <div className="disp text-3xl font-semibold leading-none num">{done ? 'Go!' : fmtClock(left)}</div>
        </div>
        {!done && <>
          <button onClick={() => adjust(-15)} className="rounded-lg bg-surf2 border border-line px-2.5 py-1.5 text-sm num">−15</button>

      </div>
    </div>
  );
}

/* ---------- runs ---------- */
function RouteMap({ route }) {
  if (!route || route.length < 2) return null;
  const lat0 = route.reduce((a, p) => a + p[0], 0) / route.length, k = Math.cos((lat0 * Math.PI) / 180);
  const pts = route.map((p) => [p[1] * k, -p[0]]), xs = pts.map((p) => p[0]), ys = pts.map((p) => p[1]);
  const minX = Math.min(...xs), maxX = Math.max(...xs), minY = Math.min(...ys), maxY = Math.max(...ys);
  const W = 320, H = 180, pad = 16, s = Math.min((W - 2 * pad) / (maxX - minX || 1e-9), (H - 2 * pad) / (maxY - minY || 1e-9));
  const ox = (W - (maxX - minX) * s) / 2, oy = (H - (maxY - minY) * s) / 2;
  const P = pts.map((p) => [ox + (p[0] - minX) * s, oy + (p[1] - minY) * s]);
  return (
    <svg viewBox={`0 0 ${W} ${H}`} className="w-full rounded-xl bg-surf2 border border-line" style={{ maxHeight: 220 }} role="img" aria-label="Route map">
      <polyline points={P.map((p) => p.join(',')).join(' ')} fill="none" stroke="#ff7a3d" strokeWidth="3" strokeLinejoin="round" strokeLinecap="round" />
      <circle cx={P[0][0]} cy={P[0][1]} r="5" fill="#4ade80" stroke="#171a21" strokeWidth="2" />
      <circle cx={P[P.length - 1][0]} cy={P[P.length - 1][1]} r="5" fill="#ff7a3d" stroke="#171a21" strokeWidth="2" />
    </svg>
  );
}

function RunView({ db, ctx }) {
  const { runs, activeRun: ar, settings } = db; const u = settings.dist || 'km', fac = dFac(u);
  const now = useNow(1000);

  const [logging, setLogging] = useState(false); const [lf, setLf] = useState({ date: dayKey(Date.now()), dist: '', h: '', m: '', s: '', note: '' });
  const [range, setRange] = useState('8W'); const [open, setOpen] = useState(null); const [del, setDel] = useState(null);
  const live = !!ar && !ar.pausedAt, watching = live && ar.mode === 'gps';

  useEffect(() => {

    if (!navigator.geolocation) { setGps('unsupported'); return; }

    const id = navigator.geolocation.watchPosition((pos) => {

      ctx.setDb((d) => {
        const r = d.activeRun; if (!r || r.pausedAt || pos.coords.accuracy > 35) return d;
        const pt = [pos.coords.latitude, pos.coords.longitude, pos.timestamp], last = r.points[r.points.length - 1];
        let dist = r.distance;
        if (last) { const seg = haversine(last, pt), dt = (pt[2] - last[2]) / 1000; if (seg < 3 || (dt > 0 && seg / dt > 12)) return d; dist += seg; }
        return { ...d, activeRun: { ...r, distance: dist, points: [...r.points, pt] } };
      });
    }, (err) => setGps(err.code === 1 ? 'denied' : 'error'), { enableHighAccuracy: true, maximumAge: 1000, timeout: 30000 });
    return () => navigator.geolocation.clearWatch(id);
  }, [watching, ar && ar.id]);
  useEffect(() => {
    if (!live) return; let lock = null;
    try { if (navigator.wakeLock) navigator.wakeLock.request('screen').then((l) => { lock = l; }).catch(() => {}); } catch (e) {}
    return () => { try { lock && lock.release(); } catch (e) {} };
  }, [live, ar && ar.id]);

  const sr = useMemo(() => [...runs].sort((a, b) => a.start - b.start), [runs]);

  const rows = useMemo(() => { let r = weeksBack(nW); if (range === 'All' && sr.length) { const f = startOfWeek(sr[0].start).getTime(); r = r.filter((x) => x.s >= f); } return r; }, [nW, range, sr]);
  const cutoff = rows.length ? rows[0].s : 0, rr = sr.filter((r) => r.start >= cutoff);
  const totD = rr.reduce((a, r) => a + r.distance, 0), totT = rr.reduce((a, r) => a + r.durationSec, 0), longest = rr.reduce((a, r) => Math.max(a, r.distance), 0);
  const el = ar ? ((ar.pausedAt || now) - ar.start - ar.pausedMs) / 1000 : 0;

  const startFinish = () => { if (!ar.pausedAt) ctx.pauseRun(); setFd(ar.distance > 0 ? (ar.distance / fac).toFixed(2) : ''); setFnote(''); setFinishing(true); };
  const save = () => { const m = (parseFloat(fd) || 0) * fac; if (m <= 0) return; ctx.finishRun(m, fnote.trim()); setFinishing(false); };
  const saveLog = () => {
    const [y, mo, d] = lf.date.split('-').map(Number), dist = (parseFloat(lf.dist) || 0) * fac, dur = (+lf.h || 0) * 3600 + (+lf.m || 0) * 60 + (+lf.s || 0);

    ctx.setDb((x) => ({ ...x, runs: [...x.runs, { id: uid(), start: new Date(y, mo - 1, d, 7).getTime(), distance: dist, durationSec: dur, route: null, note: lf.note.trim(), mode: 'manual' }] }));
    setLogging(false); setLf({ date: dayKey(Date.now()), dist: '', h: '', m: '', s: '', note: '' });
  };
  const gpsMsg = { waiting: 'Searching for GPS signal…', ok: acc != null ? `GPS locked · accurate to ±${acc} m` : 'GPS locked', denied: 'Location is blocked for this page.', unsupported: 'This browser has no location access.', error: 'Could not get a GPS fix.' }[gps];

    <div>
      <PageHeader title="Runs" sub="Record outdoor runs with GPS, or log them by hand." onSettings={() => ctx.setModal({ type: 'settings' })} />

          <div className="disp text-7xl font-semibold num leading-none mt-3 text-center">{fmtClock(el)}</div>
          <div className="grid grid-cols-2 gap-3 mt-4 text-center">
            <div className="rounded-xl bg-surf2 border border-line p-3"><div className="text-[11px] uppercase tracking-wider text-mute">Distance</div><div className="disp text-3xl font-semibold num">{ar.mode === 'gps' ? fmtDist(ar.distance, u) : '–'}<span className="text-sm text-mute ml-1">{u}</span></div></div>
            <div className="rounded-xl bg-surf2 border border-line p-3"><div className="text-[11px] uppercase tracking-wider text-mute">Avg pace</div><div className="disp text-3xl font-semibold num">{ar.mode === 'gps' ? fmtPace(el, ar.distance, u) : '–'}<span className="text-sm text-mute ml-1">/{u}</span></div></div>
          </div>
          {ar.mode === 'gps' && (
            <div className="mt-3 text-sm text-mute flex flex-wrap items-center gap-2"><MapPin size={15} className={gps === 'ok' ? 'text-ok' : ''} />{ar.pausedAt ? 'GPS paused' : gpsMsg}
              {(gps === 'denied' || gps === 'unsupported' || gps === 'error') && <button className="text-accent underline" onClick={ctx.runTimerOnly}>Continue timer-only</button>}</div>
          )}
          {ar.mode === 'timer' && <p className="mt-3 text-sm text-mute">Distance is entered when you finish.</p>}
          <div className="grid grid-cols-2 gap-3 mt-4">
            {ar.pausedAt ? <button className={btnPrimary + ' !py-3'} onClick={ctx.resumeRun}><Play size={18} /> Resume</button> : <button className={btnGhost + ' !py-3'} onClick={ctx.pauseRun}><Pause size={18} /> Pause</button>}
            <button className={btnPrimary + ' !py-3'} onClick={startFinish}><Check size={18} /> Finish</button>

        </Card>

          <div className="grid grid-cols-2 lg:grid-cols-4 gap-3">

/* ---------- plans ---------- */
const DAYS = [['M', 1], ['T', 2], ['W', 3], ['T', 4], ['F', 5], ['S', 6], ['S', 0]];
const DAY_NAMES = { 0: 'Sun', 1: 'Mon', 2: 'Tue', 3: 'Wed', 4: 'Thu', 5: 'Fri', 6: 'Sat' };

function PlanView({ db, ctx }) {
  const { templates, exercises, settings } = db; const unit = settings.unit;
  const exMap = useMemo(() => Object.fromEntries(exercises.map((e) => [e.id, e])), [exercises]);
  const [draft, setDraft] = useState(null); const [picker, setPicker] = useState(false); const [del, setDel] = useState(null);
  if (draft) {
    const setItems = (fn) => setDraft((d) => ({ ...d, items: fn(d.items) }));
    const move = (i, dir) => setItems((l) => { const a = [...l], j = i + dir; if (j < 0 || j >= a.length) return a; [a[i], a[j]] = [a[j], a[i]]; return a; });
    return (
      <div>
        <PageHeader title={draft.isNew ? 'New plan' : 'Edit plan'} onSettings={() => ctx.setModal({ type: 'settings' })} />
        <Card className="p-4 mb-3">
          <label htmlFor="plan-name" className="text-[11px] uppercase tracking-wider text-mute">Plan name</label>

          <div className="text-[11px] uppercase tracking-wider text-mute mt-4 mb-1.5">Schedule on (optional)</div>
          <div className="flex gap-1.5">{DAYS.map(([l, n], i) => <button key={i} aria-label={DAY_NAMES[n]} onClick={() => setDraft({ ...draft, day: draft.day === n ? null : n })} className={'h-10 flex-1 rounded-lg border text-sm font-medium ' + (draft.day === n ? 'bg-steel border-steel text-[#04202e]' : 'bg-surf2 border-line text-mute')}>{l}</button>)}</div>
        </Card>
        <div className="grid gap-3">
          {draft.items.map((it, i) => <ExerciseCard key={it.id} item={it} ex={exMap[it.exerciseId]} mode="plan" unit={unit} onMove={(dir) => move(i, dir)} onChange={(ni) => setItems((l) => l.map((x) => (x.id === it.id ? ni : x)))} onRemove={() => setItems((l) => l.filter((x) => x.id !== it.id))} />)}

        <div className="flex gap-2 mt-3">

          onAdd={(ids) => setItems((l) => [...l, ...ids.map((id) => { const p = lastPerf(db.workouts, id); return { id: uid(), exerciseId: id, sets: p ? p.map((s) => ({ id: uid(), weight: s.weight, reps: s.reps })) : Array.from({ length: 3 }, () => ({ id: uid(), weight: '', reps: '' })) }; })])} />}
      </div>
    );
  }
  return (
    <div>
      <PageHeader title="Plans" sub="Build workouts ahead of time, then start them in one tap." onSettings={() => ctx.setModal({ type: 'settings' })} right={<button className={btnPrimary} onClick={() => setDraft({ id: uid(), isNew: true, name: '', day: null, items: [] })}><Plus size={18} /> New</button>} />

        <div className="grid md:grid-cols-2 gap-3">

            const sets = t.items.reduce((a, i) => a + i.sets.length, 0);

                <div className="flex gap-2 mt-4">
                  <button className={btnPrimary + ' flex-1'} disabled={!!db.active} onClick={() => ctx.startWorkout(t)}><Play size={16} /> {db.active ? 'Workout running' : 'Start'}</button>

                  <button aria-label="Duplicate plan" className={btnGhost + ' !px-3'} onClick={() => ctx.saveTemplate({ ...t, id: uid(), name: t.name + ' copy', day: null, sample: undefined, items: t.items.map((i) => ({ ...i, id: uid(), sets: i.sets.map((s) => ({ ...s, id: uid() })) })) })}><Copy size={16} /></button>
                  {del === t.id ? <button className="rounded-xl bg-red-500/90 text-white font-semibold px-3" onClick={() => { ctx.deleteTemplate(t.id); setDel(null); }}>Delete?</button>
                    : <button aria-label="Delete plan" className={btnGhost + ' !px-3 hover:!border-red-400'} onClick={() => { setDel(t.id); setTimeout(() => setDel(null), 3000); }}><Trash2 size={16} /></button>}
                </div>
              </Card>
            );
          })}
        </div>
      ) : <Card><Empty icon={ClipboardList} title="No plans yet" text="Create a workout, choose a day if you like, and it waits here until you need it."><button className={btnPrimary + ' mt-2'} onClick={() => setDraft({ id: uid(), isNew: true, name: '', day: null, items: [] })}><Plus size={18} /> Create a plan</button></Empty></Card>}
    </div>
  );
}

function ExerciseSheet({ e, s, unit, onClose, onProgress }) {

      <div className="mt-4 rounded-xl bg-surf2 border border-line p-3 text-sm num">{s ? `Best est. 1RM ${Math.round(s.best)} ${unit} · ${s.n} session${s.n > 1 ? 's' : ''} · last ${relDate(s.last)}` : 'Not logged yet.'}</div>

function ImportSheet({ existing, onClose, onImport }) {
  const [key, setKey] = useState(() => { try { return localStorage.getItem('setlog.edbkey') || ''; } catch (e) { return ''; } });
  const [q, setQ] = useState(''); const [res, setRes] = useState(null); const [busy, setBusy] = useState(false); const [err, setErr] = useState(''); const [sel, setSel] = useState([]);
  const have = new Set(existing.map((e) => e.id));
  const search = async () => {
    if (!key.trim() || !q.trim()) return;
    setBusy(true); setErr(''); setSel([]);
    try { localStorage.setItem('setlog.edbkey', key.trim()); } catch (e) {}
    try {
      const r = await fetch(`https://${EDB_HOST}/api/v1/exercises?name=${encodeURIComponent(q.trim())}&limit=25`, { headers: { 'x-rapidapi-key': key.trim(), 'x-rapidapi-host': EDB_HOST } });
      if (!r.ok) throw new Error(r.status === 401 || r.status === 403 ? 'ExerciseDB rejected that key.' : r.status === 429 ? 'Request limit reached for this plan.' : `ExerciseDB returned an error (${r.status}).`);
      const j = await r.json(); setRes(j.data || []);
    } catch (e) { setRes(null); setErr(e instanceof TypeError ? 'Could not reach ExerciseDB. Importing works in the hosted app, not inside the Claude artifact viewer.' : e.message); }
    setBusy(false);
  };
  const toggle = (id) => setSel((x) => (x.includes(id) ? x.filter((i) => i !== id) : [...x, id]));
  return (
    <Sheet title="Import from ExerciseDB" onClose={onClose} wide>
      <p className="text-sm text-mute mb-3">Search the ExerciseDB library and add exercises to yours. You need a RapidAPI key for ExerciseDB (the free plan works). Each search uses one request.</p>
      <label htmlFor="edb-key" className="text-[11px] uppercase tracking-wider text-mute">RapidAPI key</label>
      <input id="edb-key" type="password" autoComplete="off" className={inputCls + ' mt-1 mb-1'} value={key} onChange={(e) => setKey(e.target.value)} placeholder="Paste your key" />
      <p className="text-xs text-faint mb-3">Saved only in this browser. Anyone using this browser profile can see it.</p>
      <div className="flex gap-2"><input id="edb-q" aria-label="Search ExerciseDB" className={inputCls} value={q} placeholder="e.g. cable fly" onChange={(e) => setQ(e.target.value)} onKeyDown={(e) => e.key === 'Enter' && search()} /><button className={btnPrimary} disabled={busy || !key.trim() || !q.trim()} onClick={search}>{busy ? '…' : 'Search'}</button></div>
      {err && <p className="text-sm text-red-300 mt-3">{err}</p>}
      {res && !res.length && <p className="text-sm text-mute mt-3">No results.</p>}
      {res && res.length > 0 && (
        <div className="mt-3 divide-y divide-line">{res.map((x) => {
          const id = 'edb_' + x.exerciseId, added = have.has(id);
          return (
            <button key={x.exerciseId} disabled={added} onClick={() => toggle(id)} className="w-full flex items-center justify-between gap-3 py-2.5 text-left disabled:opacity-50">
              <span className="min-w-0"><span className="font-medium">{titleCase(x.name)}</span><span className="block text-xs text-faint truncate">{edbMuscle(x)} · {titleCase((x.equipments || [])[0] || 'Other')}</span></span>
              {added ? <span className="text-xs text-mute">Added</span> : <span className={'h-6 w-6 shrink-0 rounded-md grid place-items-center border ' + (sel.includes(id) ? 'bg-accent border-accent text-[#1a0d05]' : 'border-line text-transparent')}><Check size={15} /></span>}
            </button>
          );
        })}</div>
      )}
      <div className="sticky bottom-0 pt-3 mt-3 bg-surf"><button className={btnPrimary + ' w-full'} disabled={!sel.length} onClick={() => { onImport((res || []).filter((x) => sel.includes('edb_' + x.exerciseId)).map(edbToEx)); onClose(); }}>Import {sel.length || ''} exercise{sel.length === 1 ? '' : 's'}</button></div>
      <p className="text-xs text-faint mt-3">Exercise data from ExerciseDB (exercisedb.dev).</p>
    </Sheet>
  );
}

/* ---------- exercise database ---------- */
function ExercisesView({ db, ctx }) {
  const { exercises, workouts } = db; const unit = db.settings.unit;
  const [q, setQ] = useState(''); const [mu, setMu] = useState('All'); const [adding, setAdding] = useState(false);
  const [nn, setNn] = useState(''); const [nm, setNm] = useState('Chest'); const [del, setDel] = useState(null);
  const [eq, setEq] = useState('All'); const [detail, setDetail] = useState(null); const [importing, setImporting] = useState(false);
  const stats = useMemo(() => {
    const s = {};
    sortedW(workouts).forEach((w) => w.items.forEach((it) => { const e = s[it.exerciseId] || (s[it.exerciseId] = { n: 0, best: 0, last: 0 }); e.n++; e.last = w.start; it.sets.forEach((x) => { e.best = Math.max(e.best, e1rm(x.weight, x.reps)); }); }));
    return s;
  }, [workouts]);
  const list = exercises.filter((e) => (mu === 'All' || e.muscle === mu) && (eq === 'All' || e.equipment === eq) && e.name.toLowerCase().includes(q.toLowerCase()));
  const groups = MUSCLES.map((m) => [m, list.filter((e) => e.muscle === m).sort((a, b) => a.name.localeCompare(b.name))]).filter(([, l]) => l.length);
  const create = () => { if (!nn.trim()) return; ctx.addExercise({ id: uid(), name: nn.trim(), muscle: nm, custom: true }); setNn(''); setAdding(false); };
  return (
    <div>
      <PageHeader title="Exercises" sub={`${exercises.length} in your database`} onSettings={() => ctx.setModal({ type: 'settings' })} right={<><button className={btnGhost + ' !py-2'} onClick={() => setImporting(true)}>Import</button><button className={btnPrimary} onClick={() => setAdding(!adding)}><Plus size={18} /> Custom</button></>} />
      {adding && (
        <Card className="p-4 mb-4 grid gap-2 pop">
          <label htmlFor="ex-new" className="text-[11px] uppercase tracking-wider text-mute">New exercise</label>
          <input id="ex-new" className={inputCls} placeholder="e.g. Cable Lateral Raise" value={nn} onChange={(e) => setNn(e.target.value)} onKeyDown={(e) => e.key === 'Enter' && create()} autoFocus />
          <select id="ex-muscle" aria-label="Muscle group" className={inputCls} value={nm} onChange={(e) => setNm(e.target.value)}>{MUSCLES.map((m) => <option key={m}>{m}</option>)}</select>
          <div className="flex gap-2"><button className={btnPrimary + ' flex-1'} onClick={create}>Add to database</button><button className={btnGhost} onClick={() => setAdding(false)}>Cancel</button></div>
        </Card>
      )}
      <div className="flex gap-2 mb-3"><div className="relative flex-1 min-w-0"><Search size={16} className="absolute left-3 top-3 text-faint" /><input id="ex-q" aria-label="Search exercises" className={inputCls + ' pl-9'} placeholder="Search exercises" value={q} onChange={(e) => setQ(e.target.value)} /></div><select id="ex-eq" aria-label="Equipment" className="rounded-lg bg-surf2 border border-line px-2.5 text-sm" value={eq} onChange={(e) => setEq(e.target.value)}><option value="All">All equipment</option>{[...new Set([...EQUIP, ...exercises.map((x) => x.equipment).filter(Boolean)])].sort().map((x) => <option key={x}>{x}</option>)}</select></div>
      <div className="flex gap-1.5 overflow-x-auto pb-3">{['All', ...MUSCLES].map((m) => <button key={m} onClick={() => setMu(m)} className={'shrink-0 rounded-full px-3 py-1 text-sm border ' + (mu === m ? 'bg-accent border-accent text-[#1a0d05] font-semibold' : 'bg-surf border-line text-mute')}>{m}</button>)}</div>
      {groups.map(([m, l]) => (
        <div key={m} className="mb-4">
          <h3 className="text-xs uppercase tracking-wider text-mute mb-1.5">{m} <span className="text-faint">· {l.length}</span></h3>
          <Card className="divide-y divide-line">
            {l.map((e) => {
              const s = stats[e.id];
              return (
                <div key={e.id} className="flex items-center gap-2 pr-2">
                  <button onClick={() => setDetail(e)} className="flex-1 min-w-0 text-left px-4 py-3">
                    <div className="font-medium truncate">{e.name}{e.custom && <span className="ml-2 text-[10px] uppercase tracking-wider text-steel">custom</span>}</div>
                    <div className="text-xs text-mute num">{e.equipment ? e.equipment + ' · ' : ''}{s ? `Best est. 1RM ${Math.round(s.best)} ${unit} · ${s.n} session${s.n > 1 ? 's' : ''} · ${relDate(s.last)}` : 'Not logged yet'}</div>
                  </button>
                  {s && <TrendingUp size={16} className="text-faint shrink-0" />}
                  {(e.custom || e.source) && (del === e.id ? <button className="rounded-lg bg-red-500/90 text-white text-sm px-2.5 py-1.5" onClick={() => { ctx.deleteExercise(e.id); setDel(null); }}>Delete?</button>
                    : <button aria-label={'Delete ' + e.name} className="h-8 w-8 grid place-items-center text-faint hover:text-red-400" onClick={() => { setDel(e.id); setTimeout(() => setDel(null), 3000); }}><Trash2 size={15} /></button>)}
                </div>
              );
            })}
          </Card>
        </div>
      ))}
      {!groups.length && <Card><Empty icon={Search} title="No exercises match" text="Try a different search, or add it as a custom exercise." /></Card>}
      {detail && <ExerciseSheet e={detail} s={stats[detail.id]} unit={unit} onClose={() => setDetail(null)} onProgress={() => { setDetail(null); ctx.openProgress(detail.id); }} />}
      {importing && <ImportSheet existing={exercises} onClose={() => setImporting(false)} onImport={ctx.importExercises} />}
    </div>
  );
}

/* ---------- progress ---------- */
function ProgressView({ db, ctx }) {
  const { workouts, exercises, settings } = db; const unit = settings.unit;
  const [tab, setTab] = useState(ctx.focus.histId ? 'History' : 'Charts'); const [range, setRange] = useState('8W');
  const [exId, setExId] = useState(ctx.focus.exId || null); const [metric, setMetric] = useState('Est. 1RM'); const [prAll, setPrAll] = useState(false);
  const exMap = useMemo(() => Object.fromEntries(exercises.map((e) => [e.id, e])), [exercises]);
  const nW = { '4W': 4, '8W': 8, '12W': 12, All: 26 }[range];
  const sorted = useMemo(() => sortedW(workouts), [workouts]);
  const wkRows = useMemo(() => {
    let rows = weeksBack(nW);
    if (range === 'All' && sorted.length) { const first = startOfWeek(sorted[0].start).getTime(); rows = rows.filter((r) => r.s >= first); }
    return rows;
  }, [nW, range, sorted]);
  const cutoff = wkRows.length ? wkRows[0].s : 0;
  const rw = sorted.filter((w) => w.start >= cutoff);
  const totalVol = rw.reduce((a, w) => a + workoutVolume(w), 0), totalSets = rw.reduce((a, w) => a + workoutSets(w), 0);
  const avgDur = rw.length ? rw.reduce((a, w) => a + (w.end - w.start) / 60000, 0) / rw.length : 0;

  const counts = {}; sorted.forEach((w) => w.items.forEach((i) => { counts[i.exerciseId] = (counts[i.exerciseId] || 0) + 1; }));
  const withHist = exercises.filter((e) => counts[e.id]).sort((a, b) => counts[b.id] - counts[a.id]);
  const selEx = exId && counts[exId] ? exId : withHist[0]?.id;
  const metricFn = { 'Est. 1RM': (it) => Math.max(0, ...it.sets.map((s) => e1rm(s.weight, s.reps))), 'Top weight': (it) => Math.max(0, ...it.sets.map((s) => +s.weight || 0)), Volume: (it) => it.sets.reduce((a, s) => a + setVol(s), 0) }[metric];
  const exData = sorted.filter((w) => w.start >= cutoff).map((w) => { const it = w.items.find((i) => i.exerciseId === selEx); return it ? { label: fmtShort(w.start), tip: fmtDate(w.start) + ' · ' + w.name, value: Math.round(metricFn(it) * 10) / 10 } : null; }).filter(Boolean);
  const first = exData[0], lastP = exData[exData.length - 1];
  const gain = first && lastP && first.value > 0 ? Math.round(((lastP.value - first.value) / first.value) * 100) : null;

  const muscleSets = {}; rw.forEach((w) => w.items.forEach((it) => { const m = exMap[it.exerciseId]?.muscle; if (m) muscleSets[m] = (muscleSets[m] || 0) + it.sets.filter((s) => s.done).length; }));
  const mRows = Object.entries(muscleSets).sort((a, b) => b[1] - a[1]), mMax = Math.max(1, ...mRows.map((r) => r[1]));

  const prs = useMemo(() => {
    const out = [];
    exercises.forEach((e) => { let best = null; sorted.forEach((w) => w.items.forEach((it) => { if (it.exerciseId !== e.id) return; it.sets.forEach((s) => { const v = e1rm(s.weight, s.reps); if (v > 0 && (!best || v > best.v + 1e-9)) best = { v, s, at: w.start }; }); })); if (best) out.push({ e, ...best }); });
    return out.sort((a, b) => b.at - a.at);
  }, [sorted, exercises]);

  // history
  const hist = [...workouts].sort((a, b) => b.start - a.start);
  const [open, setOpen] = useState(ctx.focus.histId || null); const [del, setDel] = useState(null);
  const prevSame = (w) => { for (let i = sorted.length - 1; i >= 0; i--) if (sorted[i].start < w.start && sorted[i].name === w.name) return sorted[i]; return null; };
  useEffect(() => { if (ctx.focus.histId) setTimeout(() => document.getElementById('h-' + ctx.focus.histId)?.scrollIntoView({ block: 'center' }), 80); }, []);

  const wkVol = wkRows.map((wk) => ({ label: wk.label, tip: 'Week of ' + wk.label, value: inWeek(sorted, wk).reduce((a, w) => a + workoutVolume(w), 0) }));
  const wkCnt = wkRows.map((wk) => ({ label: wk.label, tip: 'Week of ' + wk.label, value: inWeek(sorted, wk).length }));
  const perWorkout = rw.slice(-24).map((w) => ({ label: fmtShort(w.start), tip: fmtDate(w.start) + ' · ' + w.name, value: workoutVolume(w) }));
  const durData = rw.slice(-24).map((w) => ({ label: fmtShort(w.start), tip: fmtDate(w.start) + ' · ' + w.name, value: Math.round((w.end - w.start) / 60000) }));

  return (
    <div>
      <PageHeader title="Progress" sub="Volume up, over time. That's progressive overload." onSettings={() => ctx.setModal({ type: 'settings' })} right={<Seg value={tab} options={['Charts', 'History']} onChange={setTab} />} />
      {!workouts.length ? <Card><Empty icon={BarChart3} title="Nothing to chart yet" text="Finish a workout and your graphs appear here." /></Card> : tab === 'Charts' ? (
        <div className="grid gap-4">
          <div className="flex items-center justify-between gap-3"><span className="text-sm text-mute">Range</span><Seg value={range} options={['4W', '8W', '12W', 'All']} onChange={setRange} /></div>
          <div className="grid grid-cols-2 lg:grid-cols-4 gap-3">
            <Tile label="Workouts" value={rw.length} sub={`${wkRows.length} weeks`} />
            <Tile label="Total volume" value={compact(totalVol)} sub={unit} />
            <Tile label="Sets completed" value={fmtNum(totalSets)} sub={rw.length ? `${(totalSets / rw.length).toFixed(1)} per workout` : ''} />
            <Tile label="Avg duration" value={fmtMin(avgDur)} sub="per session" />
          </div>
          <ChartCard title="Strength progression" sub={gain != null ? `${selEx && exMap[selEx]?.name}: ${gain >= 0 ? '+' : ''}${gain}% over this range` : 'Pick an exercise'}
            right={<div className="flex flex-wrap gap-2 items-center"><select id="pg-ex" aria-label="Exercise" className="rounded-lg bg-surf2 border border-line px-2.5 py-1.5 text-sm max-w-[11rem]" value={selEx || ''} onChange={(e) => setExId(e.target.value)}>{withHist.map((e) => <option key={e.id} value={e.id}>{e.name}</option>)}</select><Seg value={metric} options={['Est. 1RM', 'Top weight', 'Volume']} onChange={setMetric} /></div>}>
            <LineChart data={exData} unit={unit} zeroBase={metric === 'Volume'} fmt={(v) => (metric === 'Volume' ? fmtNum(v) : v)} />
            <p className="text-xs text-faint mt-2">{metric === 'Est. 1RM' ? 'Estimated one-rep max from your best set each session (Epley formula).' : metric === 'Top weight' ? 'Heaviest completed set each session.' : 'Total weight × reps for this exercise each session.'}</p>
          </ChartCard>
          <div className="grid lg:grid-cols-2 gap-4">
            <ChartCard title="Volume per workout" sub={`Total ${unit} per session, latest ${perWorkout.length}`}><BarChart data={perWorkout} unit={unit} /></ChartCard>
            <ChartCard title="Weekly volume" sub={`Total ${unit} per week`}><BarChart data={wkVol} unit={unit} /></ChartCard>
            <ChartCard title="Weekly consistency" sub="Workouts per week against your goal"><BarChart data={wkCnt} goal={settings.goal} color="#4cc2ff" yFmt={(v) => String(v)} unit="workouts" /></ChartCard>
            <ChartCard title="Session length" sub="Minutes per workout"><LineChart data={durData} color="#4cc2ff" unit="min" /></ChartCard>
          </div>
          <ChartCard title="Training calendar" sub="Each square is a day, shaded by volume"><Heatmap workouts={sorted} /></ChartCard>
          <div className="grid lg:grid-cols-2 gap-4">
            <ChartCard title="Sets by muscle group" sub="Completed sets in this range">
              {mRows.length ? <div className="grid gap-2.5">{mRows.map(([m, n]) => (
                <div key={m} className="flex items-center gap-3 text-sm"><span className="w-20 text-mute shrink-0">{m}</span><div className="flex-1 h-2.5 rounded-r-md rounded-l-sm bg-surf2 overflow-hidden"><div className="h-full bg-accent rounded-r-md" style={{ width: (n / mMax) * 100 + '%' }} /></div><span className="w-8 text-right num font-semibold">{n}</span></div>))}</div>
                : <div className="text-mute text-sm py-6 text-center">No sets in this range.</div>}
            </ChartCard>
            <ChartCard title="Personal records" sub="Best estimated 1RM per exercise">
              <div className="divide-y divide-line">{(prAll ? prs : prs.slice(0, 6)).map((p) => (
                <div key={p.e.id} className="flex items-center gap-3 py-2"><Trophy size={15} className="text-accent shrink-0" /><div className="flex-1 min-w-0"><div className="text-sm font-medium truncate">{p.e.name}</div><div className="text-xs text-faint">{fmtShort(p.at)}</div></div><div className="text-right num"><div className="font-semibold">{p.s.weight} × {p.s.reps}</div><div className="text-xs text-mute">≈ {Math.round(p.v)} {unit}</div></div></div>))}</div>
              {prs.length > 6 && <button className="text-sm text-accent mt-2" onClick={() => setPrAll(!prAll)}>{prAll ? 'Show fewer' : `Show all ${prs.length}`}</button>}
            </ChartCard>
          </div>
        </div>
      ) : (
        <div className="grid gap-2.5">
          {hist.map((w, idx) => {
            const v = workoutVolume(w), p = prevSame(w), pv = p ? workoutVolume(p) : 0, dl = pv > 0 ? Math.round(((v - pv) / pv) * 100) : null, isOpen = open === w.id;
            const showMonth = idx === 0 || new Date(hist[idx - 1].start).getMonth() !== new Date(w.start).getMonth();
            return (
              <React.Fragment key={w.id}>
                {showMonth && <h3 className="text-xs uppercase tracking-wider text-mute mt-2">{new Date(w.start).toLocaleDateString(undefined, { month: 'long', year: 'numeric' })}</h3>}
                <Card className="overflow-hidden" >
                  <button id={'h-' + w.id} onClick={() => setOpen(isOpen ? null : w.id)} className="w-full text-left p-4 flex items-center gap-3">
                    <div className="flex-1 min-w-0"><div className="font-semibold truncate">{w.name}</div><div className="text-xs text-mute">{fmtDate(w.start)} · {fmtMin((w.end - w.start) / 60000)} · {workoutSets(w)} sets</div></div>
                    <div className="text-right"><div className="disp text-2xl font-semibold num leading-none">{fmtNum(v)}</div><div className="text-[11px] text-faint">{unit}{dl != null && <span className={'ml-1.5 ' + (dl >= 0 ? 'text-ok' : 'text-mute')}>{dl >= 0 ? '▲' : '▼'} {Math.abs(dl)}%</span>}</div></div>
                    {isOpen ? <ChevronUp size={18} className="text-faint" /> : <ChevronDown size={18} className="text-faint" />}
                  </button>
                  {isOpen && (
                    <div className="px-4 pb-4 border-t border-line pt-3 grid gap-3 pop">
                      {w.items.map((it) => (
                        <div key={it.id}><div className="text-sm font-medium">{exMap[it.exerciseId]?.name || 'Unknown'}</div>
                          <div className="flex flex-wrap gap-1.5 mt-1.5">{it.sets.map((s) => <span key={s.id} className="rounded-md bg-surf2 border border-line px-2 py-0.5 text-sm num">{s.weight} × {s.reps}</span>)}</div></div>))}
                      <div className="flex justify-end">{del === w.id ? <button className="rounded-lg bg-red-500/90 text-white text-sm px-3 py-1.5" onClick={() => { ctx.deleteWorkout(w.id); setDel(null); }}>Delete this workout?</button>
                        : <button className="text-sm text-faint hover:text-red-400 flex items-center gap-1.5" onClick={() => { setDel(w.id); setTimeout(() => setDel(null), 3000); }}><Trash2 size={14} /> Delete</button>}</div>
                    </div>
                  )}
                </Card>
              </React.Fragment>
            );
          })}
        </div>
      )}
    </div>
  );
}

/* ---------- settings + summary ---------- */
function SettingsSheet({ db, ctx, onClose }) {
  const { settings } = db; const [txt, setTxt] = useState(''); const [msg, setMsg] = useState(''); const [reset, setReset] = useState(false);
  const set = (p) => ctx.setDb((d) => ({ ...d, settings: { ...d.settings, ...p } }));
  const Step = ({ value, min, max, step, onChange, fmt }) => (
    <div className="inline-flex items-center gap-2"><button aria-label="Decrease" className="h-9 w-9 rounded-lg bg-surf2 border border-line grid place-items-center" onClick={() => onChange(Math.max(min, value - step))}><Minus size={15} /></button><span className="w-16 text-center num font-semibold">{fmt ? fmt(value) : value}</span><button aria-label="Increase" className="h-9 w-9 rounded-lg bg-surf2 border border-line grid place-items-center" onClick={() => onChange(Math.min(max, value + step))}><Plus size={15} /></button></div>
  );
  const copy = async () => { const json = JSON.stringify(db); try { await navigator.clipboard.writeText(json); setMsg('Backup copied. Paste it somewhere safe.'); } catch (e) { setTxt(json); setMsg('Copy blocked here. Select the text below and copy it manually.'); } };
  const restore = () => { try { const d = JSON.parse(txt); if (!Array.isArray(d.exercises) || !Array.isArray(d.workouts)) throw 0; ctx.setDb({ templates: [], runs: [], activeRun: null, active: null, rest: null, ...d, exercises: mergeEx(d.exercises), settings: { unit: 'kg', dist: 'km', rest: 90, goal: 4, ...(d.settings || {}) } }); setMsg('Backup restored.'); setTxt(''); } catch (e) { setMsg('That text is not a valid Setlog backup.'); } };
  return (
    <Sheet title="Settings" onClose={onClose}>
      <div className="grid gap-4">
        <div className="flex items-center justify-between gap-3"><div><div className="font-medium">Rest timer</div><div className="text-xs text-mute">Starts when you complete a set</div></div><Step value={settings.rest} min={15} max={600} step={15} onChange={(v) => set({ rest: v })} fmt={fmtClock} /></div>
        <div className="flex items-center justify-between gap-3"><div><div className="font-medium">Weekly goal</div><div className="text-xs text-mute">Workouts per week</div></div><Step value={settings.goal} min={1} max={7} step={1} onChange={(v) => set({ goal: v })} /></div>
        <div className="flex items-center justify-between gap-3"><div><div className="font-medium">Run distance unit</div><div className="text-xs text-mute">Converts how runs are shown</div></div><Seg value={settings.dist || 'km'} options={['km', 'mi']} onChange={(v) => set({ dist: v })} /></div>
        <div className="flex items-center justify-between gap-3"><div><div className="font-medium">Weight unit</div><div className="text-xs text-mute">Label only. Logged numbers are not converted.</div></div><Seg value={settings.unit} options={['kg', 'lb']} onChange={(v) => set({ unit: v })} /></div>
        <div className="border-t border-line pt-4">
          <div className="font-medium mb-2">Backup</div>
          <div className="flex gap-2 mb-2"><button className={btnGhost + ' flex-1'} onClick={copy}><Copy size={15} /> Copy backup</button><button className={btnGhost + ' flex-1'} disabled={!txt.trim()} onClick={restore}>Restore pasted</button></div>
          <textarea id="backup-txt" aria-label="Backup text" rows="3" className={inputCls + ' text-xs'} placeholder="Paste a backup here to restore it" value={txt} onChange={(e) => setTxt(e.target.value)} />
          {msg && <p className="text-xs text-mute mt-1.5">{msg}</p>}
        </div>
        <div className="border-t border-line pt-4 grid gap-2">
          {(db.workouts.some((w) => w.sample) || db.templates.some((t) => t.sample) || db.runs.some((r) => r.sample)) ? <button className={btnGhost} onClick={() => { ctx.clearSample(); onClose(); }}>Clear sample data</button> : <button className={btnGhost} onClick={ctx.loadSample}>Add sample data</button>}
          {reset ? <button className="rounded-xl bg-red-500/90 text-white font-semibold px-4 py-2.5" onClick={() => { ctx.resetAll(); onClose(); }}>Yes, erase everything</button> : <button className={btnGhost + ' hover:!border-red-400'} onClick={() => setReset(true)}>Reset all data</button>}
        </div>
      </div>
    </Sheet>
  );
}

function SummarySheet({ data, db, onClose }) {
  const { workout: w, prs } = data; const unit = db.settings.unit;
  const exMap = Object.fromEntries(db.exercises.map((e) => [e.id, e]));
  return (
    <Sheet title="Workout saved" onClose={onClose}>
      <div className="text-center py-2"><div className="h-14 w-14 mx-auto rounded-full bg-ok/15 text-ok grid place-items-center"><Check size={28} /></div><div className="disp text-3xl font-semibold mt-2">{w.name}</div></div>
      <div className="grid grid-cols-3 gap-2 my-4">
        {[['Time', fmtMin((w.end - w.start) / 60000)], ['Volume', fmtNum(workoutVolume(w)) + ' ' + unit], ['Sets', workoutSets(w)]].map(([l, v]) => <div key={l} className="rounded-xl bg-surf2 border border-line p-3 text-center"><div className="text-[11px] uppercase tracking-wider text-mute">{l}</div><div className="disp text-xl font-semibold num">{v}</div></div>)}
      </div>
      {prs.length > 0 && <div className="rounded-xl border border-accent/40 bg-accent/10 p-3 mb-4"><div className="flex items-center gap-2 font-semibold text-accent mb-1"><Trophy size={16} /> New personal record{prs.length > 1 ? 's' : ''}</div>{prs.map((p) => <div key={p.exerciseId} className="text-sm flex justify-between"><span>{exMap[p.exerciseId]?.name}</span><span className="num text-mute">est. 1RM {Math.round(p.value)} {unit}</span></div>)}</div>}
      <button className={btnPrimary + ' w-full'} onClick={onClose}>Done</button>
    </Sheet>
  );
}

/* ---------- app shell ---------- */
const NAV = [['home', 'Home', LayoutDashboard], ['workout', 'Workout', Dumbbell], ['runs', 'Runs', Activity], ['plan', 'Plans', ClipboardList], ['exercises', 'Exercises', ListChecks], ['progress', 'Progress', TrendingUp]];

function App() {
  const [db, setDb] = useState(loadDb); const [view, setView] = useState('home'); const [modal, setModal] = useState(null); const [focus, setFocus] = useState({});
  useEffect(() => { saveDb(db); }, [db]);
  useEffect(() => { window.scrollTo(0, 0); }, [view]);

  const ctx = {
    db, setDb, setView, setModal, focus,
    openHistory: (id) => { setFocus({ histId: id }); setView('progress'); },
    openProgress: (exId) => { setFocus({ exId }); setView('progress'); },
    addExercise: (ex) => setDb((d) => ({ ...d, exercises: [...d.exercises, ex] })),
    importExercises: (list) => setDb((d) => ({ ...d, exercises: [...d.exercises, ...list.filter((x) => !d.exercises.some((e) => e.id === x.id))] })),
    deleteExercise: (id) => setDb((d) => ({ ...d, exercises: d.exercises.filter((e) => e.id !== id) })),
    startRest: () => setDb((d) => (d.settings.rest > 0 ? { ...d, rest: { end: Date.now() + d.settings.rest * 1000, total: d.settings.rest * 1000 } } : d)),
    startWorkout: (tpl) => {
      setDb((d) => {
        if (d.active) return d;
        const h = new Date().getHours(), nm = (h < 12 ? 'Morning' : h < 18 ? 'Afternoon' : 'Evening') + ' workout';
        return { ...d, active: { id: uid(), name: tpl ? tpl.name : nm, start: Date.now(), templateId: tpl ? tpl.id : null, items: tpl ? tpl.items.map((it) => ({ id: uid(), exerciseId: it.exerciseId, sets: it.sets.map((s) => ({ id: uid(), weight: s.weight, reps: s.reps, done: false })) })) : [] } };
      });
      setView('workout');
    },
    discardWorkout: () => { setDb((d) => ({ ...d, active: null, rest: null })); setView('home'); },
    finishWorkout: () => {
      const a = db.active; if (!a) return;
      const items = a.items.map((it) => ({ ...it, sets: it.sets.filter((s) => s.done).map((s) => ({ ...s, weight: +s.weight || 0, reps: +s.reps || 0 })) })).filter((it) => it.sets.length);
      if (!items.length) return;
      const w = { id: a.id, name: a.name.trim() || 'Workout', start: a.start, end: Date.now(), items };
      const prs = [];
      items.forEach((it) => { const prev = bestE1rm(db.workouts, it.exerciseId), cur = Math.max(...it.sets.map((s) => e1rm(s.weight, s.reps))); if (prev > 0 && cur > prev + 0.001) prs.push({ exerciseId: it.exerciseId, value: cur }); });
      setDb((d) => ({ ...d, workouts: [...d.workouts, w], active: null, rest: null }));
      setModal({ type: 'summary', workout: w, prs });
      setView('home');
    },
    saveAsTemplate: () => setDb((d) => d.active ? { ...d, templates: [...d.templates, { id: uid(), name: d.active.name || 'Workout', day: null, items: d.active.items.map((it) => ({ id: uid(), exerciseId: it.exerciseId, sets: it.sets.map((s) => ({ id: uid(), weight: s.weight, reps: s.reps })) })) }] } : d),
    saveTemplate: (t) => setDb((d) => ({ ...d, templates: d.templates.some((x) => x.id === t.id) ? d.templates.map((x) => (x.id === t.id ? t : x)) : [...d.templates, t] })),
    deleteTemplate: (id) => setDb((d) => ({ ...d, templates: d.templates.filter((t) => t.id !== id) })),
    deleteWorkout: (id) => setDb((d) => ({ ...d, workouts: d.workouts.filter((w) => w.id !== id) })),
    startRun: (mode) => { if (mode === 'gps' && !navigator.geolocation) mode = 'timer'; setDb((d) => (d.activeRun ? d : { ...d, activeRun: { id: uid(), start: Date.now(), pausedMs: 0, pausedAt: null, distance: 0, points: [], mode } })); },
    pauseRun: () => setDb((d) => (d.activeRun && !d.activeRun.pausedAt ? { ...d, activeRun: { ...d.activeRun, pausedAt: Date.now() } } : d)),
    resumeRun: () => setDb((d) => (d.activeRun && d.activeRun.pausedAt ? { ...d, activeRun: { ...d.activeRun, pausedMs: d.activeRun.pausedMs + Date.now() - d.activeRun.pausedAt, pausedAt: null } } : d)),
    runTimerOnly: () => setDb((d) => (d.activeRun ? { ...d, activeRun: { ...d.activeRun, mode: 'timer' } } : d)),
    discardRun: () => setDb((d) => ({ ...d, activeRun: null })),
    finishRun: (distance, note) => setDb((d) => {
      const r = d.activeRun; if (!r) return d;
      const dur = Math.round(((r.pausedAt || Date.now()) - r.start - r.pausedMs) / 1000);
      let route = r.points.map((p) => [+p[0].toFixed(5), +p[1].toFixed(5)]);
      if (route.length > 600) { const k = Math.ceil(route.length / 600); route = route.filter((_, i) => i % k === 0); }
      return { ...d, activeRun: null, runs: [...d.runs, { id: r.id, start: r.start, durationSec: dur, distance, route: route.length > 1 ? route : null, note, mode: r.mode }] };
    }),
    deleteRun: (id) => setDb((d) => ({ ...d, runs: d.runs.filter((r) => r.id !== id) })),
    clearSample: () => setDb((d) => ({ ...d, workouts: d.workouts.filter((w) => !w.sample), templates: d.templates.filter((t) => !t.sample), runs: d.runs.filter((r) => !r.sample) })),
    loadSample: () => setDb((d) => { const s = makeSample(); return { ...d, workouts: [...d.workouts, ...s.workouts], templates: [...d.templates, ...s.templates], runs: [...d.runs, ...s.runs], exercises: [...DEFAULT_EX.filter((e) => !d.exercises.some((x) => x.id === e.id)), ...d.exercises] }; }),
    resetAll: () => { setDb({ exercises: DEFAULT_EX, templates: [], workouts: [], runs: [], activeRun: null, active: null, rest: null, settings: { unit: 'kg', dist: 'km', rest: 90, goal: 4 } }); setView('home'); },
  };

  const page = view === 'home' ? <Dashboard db={db} ctx={ctx} /> : view === 'workout' ? <WorkoutView db={db} ctx={ctx} /> : view === 'runs' ? <RunView db={db} ctx={ctx} /> : view === 'plan' ? <PlanView db={db} ctx={ctx} /> : view === 'exercises' ? <ExercisesView db={db} ctx={ctx} /> : <ProgressView key={JSON.stringify(focus)} db={db} ctx={ctx} />;
  return (
    <div className="min-h-screen">
      <aside className="hidden md:flex fixed inset-y-0 left-0 w-56 flex-col border-r border-line bg-surf px-3 py-5">
        <div className="flex items-center gap-2.5 px-3 mb-6"><div className="h-9 w-9 rounded-xl bg-accent text-[#1a0d05] grid place-items-center"><Dumbbell size={20} /></div><span className="disp text-3xl font-semibold">Setlog</span></div>
        <nav className="grid gap-1">{NAV.map(([k, l, I]) => (
          <button key={k} onClick={() => setView(k)} className={'flex items-center gap-3 rounded-xl px-3 py-2.5 text-left transition ' + (view === k ? 'bg-surf2 text-ink' : 'text-mute hover:text-ink hover:bg-surf2/60')}>
            <I size={19} className={view === k ? 'text-accent' : ''} /><span className="font-medium">{l}</span>{((k === 'workout' && db.active) || (k === 'runs' && db.activeRun)) && <span className="ml-auto h-2 w-2 rounded-full bg-accent" />}
          </button>))}</nav>
      </aside>
      <main className="md:pl-56">
        <div className="mx-auto max-w-5xl px-4 md:px-8 pt-5 md:pt-8 pb-40 md:pb-32">{page}</div>
      </main>
      <nav className="md:hidden fixed bottom-0 inset-x-0 z-30 bg-surf/95 backdrop-blur border-t border-line grid grid-cols-6 pb-[env(safe-area-inset-bottom,0px)]">
        {NAV.map(([k, l, I]) => (
          <button key={k} onClick={() => setView(k)} className={'relative flex flex-col items-center gap-0.5 pt-2.5 pb-2 text-[11px] ' + (view === k ? 'text-accent' : 'text-mute')}>
            <I size={21} />{l}{((k === 'workout' && db.active) || (k === 'runs' && db.activeRun)) && <span className="absolute top-2 right-[28%] h-2 w-2 rounded-full bg-accent" />}
          </button>))}
      </nav>
      {db.rest && <RestBar rest={db.rest} setDb={setDb} />}
      {modal && modal.type === 'settings' && <SettingsSheet db={db} ctx={ctx} onClose={() => setModal(null)} />}
      {modal && modal.type === 'summary' && <SummarySheet data={modal} db={db} onClose={() => setModal(null)} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body></html>
