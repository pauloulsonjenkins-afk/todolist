<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loading...</title>
</head>
<body style="font-family:system-ui,sans-serif;padding:24px">Loading your list...
<script>
(async function () {
  var u = (new URLSearchParams(location.search).get('u') || '').toLowerCase();
  var ok = false;
  try { ok = !!u && sessionStorage.getItem('todo_authed_' + u) === '1'; } catch (e) {}
  if (!ok) { location.replace('index.html'); return; }
  try {
    var r = await fetch('todo-app.html', { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    var html = await r.text();
    var tag = '<scr' + 'ipt>';
    var i = html.indexOf(tag);
    html = html.slice(0, i) + '<scr' + 'ipt src="gh-storage.js"></scr' + 'ipt>\n' + html.slice(i);
    var name = u === 'oj' ? 'OJ' : u === 'nick' ? 'Nick' : u;
    html = html.replace(/<title>[^<]*<\/title>/, '<title>To-do - ' + name + '</title>');
    document.open(); document.write(html); document.close();
  } catch (e) {
    document.body.textContent = 'Could not load the app: ' + e.message;
  }
})();
</script>
</body>
</html>
